name: API Contract Check
on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ── 1. Rails テスト ──
      - name: Run Rails tests
        working-directory: backend
        run: |
          bundle install
          bundle exec rspec

      # ── 2. ★ スペック再生成 → 差分チェック ──
      - name: Check spec is up to date
        working-directory: backend
        run: |
          OPENAPI=1 bundle exec rspec
          git diff --exit-code doc/openapi.yaml

      # ── 3. スペックのリント ──
      - name: Lint OpenAPI spec
        run: npx @redocly/cli lint backend/doc/openapi.yaml

      # ── 4. フロント型チェック ──
      - name: Generate types and typecheck
        working-directory: frontend
        run: |
          npm ci
          npm run generate:api
          npm run typecheck